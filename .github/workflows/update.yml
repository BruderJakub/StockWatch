name: Update prices & deploy

on:
  # Hourly at :15 during US market hours (13:15–21:15 UTC covers 9:30–16:00 New York
  # in both summer and winter time), Monday–Friday. GitHub may start runs a few minutes late.
  schedule:
    - cron: "15 13-21 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stockwatch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keeps the downloaded price history between runs, so the 3-year daily
      # history is only fetched once per day (saves API credits).
      - name: Restore cached data
        uses: actions/cache@v4
        with:
          path: data
          key: stockwatch-data-${{ github.run_id }}
          restore-keys: stockwatch-data-

      - name: Fetch prices
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html style.css app.js _site/
          cp -r data _site/data
          find _site -name '*.raw.json' -delete

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
